[package]
name = "workflow-python"
version = "0.4.0-preview.1"
description = "Experimental in-process Python bindings for Workflow OS Core."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.83"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
workflow-core = { path = "../workflow-core", features = ["trusted-host-application-spi"] }
pyo3 = { version = "=0.27.2", features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4"
time = "0.3"

[lints]
workspace = true
