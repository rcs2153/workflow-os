[package]
name = "workflow-local-host"
version = "0.2.0-preview.1"
description = "Unpublished local trusted-host composition boundary for Workflow OS."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
workflow-core = { path = "../workflow-core", features = ["trusted-host-application-spi"] }

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde_json = "1.0"
time = "0.3"

[lints]
workspace = true
