[package]
name = "workflow-cli"
version = "0.4.0-preview.1"
description = "CLI foundation for Workflow OS."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "workflow-os"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
workflow-core = { path = "../workflow-core", features = ["trusted-host-application-spi"] }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
