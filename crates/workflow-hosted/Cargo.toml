[package]
name = "workflow-hosted"
version = "0.2.0-preview.1"
description = "Single-tenant hosted alpha service for Workflow OS."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "workflow-os-hosted"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["json"] }
postgres = "0.19.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
workflow-core = { path = "../workflow-core" }

[lints]
workspace = true
