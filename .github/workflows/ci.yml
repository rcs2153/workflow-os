name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fresh-checkout-aggregate-check:
    name: Fresh Checkout Aggregate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove clean-checkout aggregate validation
        run: |
          test ! -e target/debug/workflow-os
          npm run check
          test -x target/debug/workflow-os

      - name: Verify synthetic recovery bridge with the real CLI
        run: npm run test:synthetic-recovery-bridge

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Rehearse private signer isolation under separate Linux identities
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --locked -p workflow-core --lib --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.name == "workflow_core" and .profile.test and .executable != null) | .executable')
          bash scripts/rehearse-signer-isolation.sh "$binary"

      - name: Rust docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Cargo lockfile validation
        run: cargo metadata --locked --format-version 1

  macos-signer-rehearsal:
    name: macOS Signer Isolation Rehearsal
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rehearse private signer isolation under separate macOS identities
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --locked -p workflow-core --lib --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.name == "workflow_core" and .profile.test and .executable != null) | .executable')
          bash scripts/rehearse-signer-isolation.sh "$binary"

  release-packaging-rehearsal:
    name: Release Packaging Rehearsal
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test release packaging contract
        run: npm run test:release-package

      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Linux x86_64 release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release -p workflow-cli --bin workflow-os --target x86_64-unknown-linux-musl

      - name: Package provisional Linux archive
        run: >-
          npm run package:release --
          --target x86_64-unknown-linux-musl
          --binary target/x86_64-unknown-linux-musl/release/workflow-os
          --output-dir dist/rehearsal
          --source-commit "${SOURCE_COMMIT}"
          --provisional

      - name: Verify checksum, install, and uninstall contracts
        run: |
          mapfile -t archives < <(find dist/rehearsal -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          archive_dir="$(dirname "${archive}")"
          archive_name="$(basename "${archive}")"
          (cd "${archive_dir}" && sha256sum --check "${archive_name}.sha256")
          rehearsal_root="$(mktemp -d)"
          package_name="$(tar -tzf "${archive}" | head -n 1 | sed 's:/$::')"
          tar -xzf "${archive}" -C "${rehearsal_root}"
          package_root="${rehearsal_root}/${package_name}"
          version="$(node -p 'require("./package.json").version')"
          WORKFLOW_OS_INSTALL_DIR="${rehearsal_root}/bin" "${package_root}/install.sh"
          test "$("${rehearsal_root}/bin/workflow-os" --version)" = "workflow-os ${version}"
          if WORKFLOW_OS_INSTALL_DIR="${rehearsal_root}/bin" "${package_root}/install.sh"; then
            echo "install unexpectedly replaced an existing binary" >&2
            exit 1
          fi
          WORKFLOW_OS_INSTALL_DIR="${rehearsal_root}/bin" "${package_root}/uninstall.sh"
          test ! -e "${rehearsal_root}/bin/workflow-os"

  postgresql-state:
    name: Shared PostgreSQL State
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: workflow_os
          POSTGRES_PASSWORD: workflow_os_ci_only
          POSTGRES_DB: workflow_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow_os -d workflow_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORKFLOW_OS_TEST_POSTGRES_URL: postgres://workflow_os:workflow_os_ci_only@127.0.0.1:5432/workflow_os_test
      WORKFLOW_OS_REQUIRE_POSTGRES_TESTS: "1"
      WORKFLOW_OS_POSTGRES_SOURCE_URL: postgres://workflow_os:workflow_os_ci_only@127.0.0.1:5432/workflow_os_test
      WORKFLOW_OS_POSTGRES_RESTORE_ADMIN_URL: postgres://workflow_os:workflow_os_ci_only@127.0.0.1:5432/postgres
      WORKFLOW_OS_POSTGRES_RESTORE_URL: postgres://workflow_os:workflow_os_ci_only@127.0.0.1:5432/workflow_os_restore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --silent \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes \
                --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"

      - name: PostgreSQL state conformance
        run: cargo test -p workflow-core --test postgres_state_backend postgresql_backend_proves_shared_state_milestone -- --exact

      - name: Collaborative project boundary
        run: cargo test -p workflow-hosted tests::collaborative_project_boundary -- --exact

      - name: PostgreSQL backup and restore rehearsal
        run: bash scripts/rehearse-postgresql-state-recovery.sh

  hosted-alpha-recovery:
    name: Hosted Alpha Recovery
    runs-on: ubuntu-latest
    env:
      WORKFLOW_OS_HOSTED_DATABASE_ADMIN_PASSWORD: hosted_alpha_ci_admin_only
      WORKFLOW_OS_HOSTED_DATABASE_PASSWORD: hosted_alpha_ci_runtime_only
      WORKFLOW_OS_HOSTED_TOKEN: hosted-alpha-ci-token-only
      WORKFLOW_OS_HOSTED_CLEANUP: "1"
      WORKFLOW_OS_HOSTED_COMPOSE_PROJECT: workflow-os-hosted-alpha-ci
      WORKFLOW_OS_HOSTED_REHEARSAL_RUN_SUFFIX: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehearse governed run and restart recovery
        run: bash scripts/rehearse-hosted-alpha.sh

  typescript:
    name: TypeScript And Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck --workspace @workflow-os/sdk-typescript

      - name: TypeScript lint
        run: npm run lint --workspace @workflow-os/sdk-typescript

      - name: TypeScript tests
        run: npm run test --workspace @workflow-os/sdk-typescript

      - name: Documentation checks
        run: npm run check:docs

      - name: npm lockfile validation
        run: npm ci --ignore-scripts

  contracts:
    name: Schema SDK And Example Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Workflow OS CLI
        run: cargo build -p workflow-cli --bin workflow-os

      - name: Check schema SDK and example synchronization
        run: npm run check:contracts

  read-only-integrations:
    name: Phase 2 Read-Only Integration Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Workflow OS CLI
        run: cargo build -p workflow-cli --bin workflow-os

      - name: Check read-only adapter contracts and fixture examples
        run: npm run check:integrations

  security:
    name: Dependency And Security
    runs-on: ubuntu-latest
    env:
      # RustSec main currently contains malformed placeholder advisory data at
      # e11d6b3. Keep the audit fail-closed against the immediately preceding
      # valid database revision until upstream repairs the database.
      RUSTSEC_ADVISORY_DB_REVISION: 309ad29d8fe448bf986019e05d47b9e0e29a2218
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned RustSec advisory database
        uses: actions/checkout@v4
        with:
          repository: RustSec/advisory-db
          ref: ${{ env.RUSTSEC_ADVISORY_DB_REVISION }}
          path: .rustsec-advisory-db
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust dependency audit
        run: |
          test "$(git -C .rustsec-advisory-db rev-parse HEAD)" = "${RUSTSEC_ADVISORY_DB_REVISION}"
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit \
            --db .rustsec-advisory-db \
            --no-fetch \
            --file Cargo.lock

      - name: Install dependencies
        run: npm ci

      - name: npm dependency audit
        run: npm audit --audit-level=moderate
